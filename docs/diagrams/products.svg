<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <title>Products and how they depend on each other</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
  </defs>
  <rect width="860" height="430" fill="#fff"/>
  <text x="20" y="28" font-size="12" fill="#666">PRODUCTS (what you link)</text>
  <text x="20" y="288" font-size="12" fill="#666">INTERNAL TARGETS</text>
  <rect x="300" y="40" width="200" height="44" rx="8" fill="#eef2ff" stroke="#4f5bd5" stroke-width="1.5"/>
  <text x="400" y="67" text-anchor="middle" font-weight="600">Your app</text>
  <rect x="20" y="110" width="200" height="56" rx="8" fill="#e8f7ee" stroke="#2f9e5b" stroke-width="1.5"/>
  <text x="120" y="134" text-anchor="middle" font-weight="600">PlaybackNowPlaying</text>
  <text x="120" y="153" text-anchor="middle" font-size="12" fill="#444">lock screen, remote commands</text>
  <rect x="260" y="110" width="200" height="56" rx="8" fill="#e8f7ee" stroke="#2f9e5b" stroke-width="1.5"/>
  <text x="360" y="134" text-anchor="middle" font-weight="600">PlaybackPlayer</text>
  <text x="360" y="153" text-anchor="middle" font-size="12" fill="#444">item list, state, audio session</text>
  <rect x="500" y="110" width="200" height="56" rx="8" fill="#e8f7ee" stroke="#2f9e5b" stroke-width="1.5"/>
  <text x="600" y="134" text-anchor="middle" font-weight="600">PlaybackRender</text>
  <text x="600" y="153" text-anchor="middle" font-size="12" fill="#444">Transport, gapless output</text>
  <rect x="20" y="210" width="200" height="56" rx="8" fill="#e8f7ee" stroke="#2f9e5b" stroke-width="1.5"/>
  <text x="120" y="234" text-anchor="middle" font-weight="600">PlaybackStreaming</text>
  <text x="120" y="253" text-anchor="middle" font-size="12" fill="#444">URL while it downloads</text>
  <rect x="500" y="210" width="200" height="56" rx="8" fill="#e8f7ee" stroke="#2f9e5b" stroke-width="1.5"/>
  <text x="600" y="234" text-anchor="middle" font-weight="600">PlaybackDecode</text>
  <text x="600" y="253" text-anchor="middle" font-size="12" fill="#444">decoder + StreamByteReader</text>
  <rect x="740" y="210" width="100" height="56" rx="8" fill="#fff7e6" stroke="#d98a00" stroke-width="1.5"/>
  <text x="790" y="234" text-anchor="middle" font-weight="600">FFmpeg</text>
  <text x="790" y="253" text-anchor="middle" font-size="12" fill="#444">own C code</text>
  <rect x="20" y="300" width="240" height="56" rx="8" fill="#f3f3f3" stroke="#888" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="140" y="324" text-anchor="middle" font-weight="600" font-size="12">*TestSupport products</text>
  <text x="140" y="341" text-anchor="middle" font-size="11" fill="#444">one per layer, tests only</text>
  <rect x="500" y="305" width="200" height="50" rx="8" fill="#f3f3f3" stroke="#888" stroke-width="1.5"/>
  <text x="600" y="327" text-anchor="middle" font-weight="600">CStreamDecode</text>
  <text x="600" y="345" text-anchor="middle" font-size="12" fill="#444">C shim over libavformat</text>
  <rect x="300" y="375" width="500" height="36" rx="8" fill="#f3f3f3" stroke="#888" stroke-width="1.5"/>
  <text x="550" y="398" text-anchor="middle" font-weight="600">CFFmpeg → FFmpeg.framework (dynamic, LGPL-2.1)</text>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M340 84 L120 110"/>
    <path d="M380 84 L360 110"/>
    <path d="M440 84 L580 110"/>
    <path d="M300 62 H10 V238 H20" stroke-dasharray="5 3"/>
    <path d="M480 84 V190 L540 210" stroke-dasharray="5 3"/>
    <path d="M500 62 H850 V238 H840" stroke-dasharray="5 3"/>
    <path d="M220 138 L260 138"/>
    <path d="M460 138 L500 138"/>
    <path d="M600 166 L600 210"/>
    <path d="M220 238 L500 238"/>
    <path d="M600 266 L600 305"/>
    <path d="M600 355 L600 375"/>
    <path d="M790 266 L790 375"/>
  </g>
</svg>

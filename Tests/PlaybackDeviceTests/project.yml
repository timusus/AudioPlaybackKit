# The device suite as an Xcode project, since an iPhone cannot run a package's tool-hosted test
# bundle. `scripts/device-test.sh` generates it next to this file (git ignores it) and runs it; the team comes
# from the command line.
name: PlaybackDeviceTests
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
packages:
  AudioPlaybackKit:
    path: ../..
targets:
  # Hosts the tests, with the audio background mode and session the apps have, so a call can end
  # with the player still in charge of its session.
  DeviceTestHost:
    type: application
    platform: iOS
    sources:
      - Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplecityapps.playbackdevicetests
    info:
      path: ../../.build/device-tests/Host-Info.plist
      properties:
        CFBundleDisplayName: Playback Device Tests
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        # The interrupter reopens the host through this when its call or playback ends.
        CFBundleURLTypes:
          - CFBundleURLName: com.simplecityapps.playbackdevicetests
            CFBundleURLSchemes: [playbackdevicetests]
  PlaybackDeviceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # File by file: XcodeGen lists a subfolder of a `.` source in two groups.
      - AudibleTests.swift
      - DeviceRig.swift
      - ElapsedTimeTests.swift
      - RealCallTests.swift
      - RemoteCommandTests.swift
      - SessionNotificationTests.swift
      - path: Fixtures
        buildPhase: resources
    dependencies:
      - target: DeviceTestHost
      - package: AudioPlaybackKit
        product: PlaybackPlayer
      - package: AudioPlaybackKit
        product: PlaybackNowPlaying
      - package: AudioPlaybackKit
        product: PlaybackRender
      - package: AudioPlaybackKit
        product: PlaybackDecode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplecityapps.playbackdevicetests.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DeviceTestHost.app/DeviceTestHost
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  # Interrupts the host from outside, as another app on the phone does: `call` reports and answers
  # a CallKit call, `play` starts a non-mixable `.playback` session.
  Interruptor:
    type: application
    platform: iOS
    sources:
      - Interruptor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplecityapps.playbackdevicetests.interruptor
    info:
      path: ../../.build/device-tests/Interruptor-Info.plist
      properties:
        CFBundleDisplayName: Interruptor
        UILaunchScreen: {}
        UIBackgroundModes: [voip, audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.simplecityapps.playbackdevicetests.interruptor
            CFBundleURLSchemes: [playbackinterruptor]
schemes:
  PlaybackDeviceTests:
    build:
      targets:
        DeviceTestHost: all
        Interruptor: all
        PlaybackDeviceTests: [test]
    test:
      targets: [PlaybackDeviceTests]
